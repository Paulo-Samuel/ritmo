# Monta o instalador e publica uma versão nova no GitHub sempre que uma tag vX.Y.Z é enviada.
# O app instalado confere essas versões e se atualiza sozinho.
name: Publicar versão

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Montar o instalador
        run: npx electron-builder --win nsis --publish never
      - name: Publicar a versão
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          files="dist/Ritmo-Instalador.exe dist/Ritmo-Instalador.exe.blockmap dist/latest.yml"
          ls -l $files
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "Ritmo ${tag#v}" --generate-notes
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
