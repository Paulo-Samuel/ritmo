# Monta o instalador e publica uma versão nova no GitHub sempre que uma tag vX.Y.Z é enviada.
# O app instalado confere essas versões e se atualiza sozinho.
name: Publicar versão

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Montar o instalador
        run: npx electron-builder --win nsis --publish never
      - name: Publicar a versão
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          files="dist/Ritmo-Instalador.exe dist/Ritmo-Instalador.exe.blockmap dist/latest.yml"
          ls -l $files
          # Se existir mais de uma versão com a mesma tag, fica só a que tem mais arquivos.
          extras=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.assets | length) \(.id)\"" | sort -rn | tail -n +2 | cut -d' ' -f2)
          for id in $extras; do echo "Apagando versão repetida $id"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "Ritmo ${tag#v}" --generate-notes
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
