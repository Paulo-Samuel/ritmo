<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritmo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23ff7a59'/%3E%3Cpath d='M6.5 10.5v3M9.8 8v8M13.1 6v12M16.4 9v6' stroke='%23111' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="nav-btns">
        <button class="round sm" id="back" data-act="back" title="Voltar" aria-label="Voltar" data-icon="back"></button>
        <button class="round sm" id="fwd" data-act="fwd" title="Avançar" aria-label="Avançar" data-icon="fwd"></button>
      </div>
      <div class="top-center">
        <button class="round" id="homeBtn" data-act="home" title="Início" aria-label="Início" data-icon="home"></button>
        <button class="round" id="dlBtn" data-act="nav-download" title="Baixar músicas de links" aria-label="Baixar músicas" data-icon="download"></button>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="O que você quer ouvir?" autocomplete="off" spellcheck="false" aria-label="Buscar">
        </label>
      </div>
      <button class="brand" data-act="brand-menu" title="Sobre o Ritmo"><span class="brand-dot" data-icon="wave"></span><span>Ritmo</span></button>
    </header>

    <aside class="sidebar panel" id="sidebar" aria-label="Sua biblioteca"></aside>
    <main class="main panel" id="main"></main>
    <aside class="right panel" id="right" aria-label="Tocando agora"></aside>

    <footer class="player" aria-label="Player">
      <div class="p-left" id="pInfo"></div>
      <div class="p-center">
        <div class="p-controls">
          <button class="icon-btn" data-act="shuffle" title="Ordem aleatória" aria-label="Ordem aleatória" data-icon="shuffle"></button>
          <button class="icon-btn" data-act="prev" title="Anterior" aria-label="Anterior" data-icon="prev"></button>
          <button class="p-play" data-act="play" title="Tocar / pausar (espaço)" aria-label="Tocar ou pausar"><span class="i-play" data-icon="play"></span><span class="i-pause" data-icon="pause"></span></button>
          <button class="icon-btn" data-act="next" title="Próxima" aria-label="Próxima" data-icon="next"></button>
          <button class="icon-btn" id="btnRepeat" data-act="repeat" title="Repetir" aria-label="Repetir" data-icon="repeat"></button>
        </div>
        <div class="p-progress">
          <span id="tCur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posição da música">
          <span id="tDur">0:00</span>
        </div>
      </div>
      <div class="p-right">
        <button class="icon-btn" id="btnQueue" data-act="toggle-right" title="Painel Tocando agora" aria-label="Painel Tocando agora" data-icon="panel"></button>
        <button class="icon-btn" id="btnMute" data-act="mute" title="Silenciar" aria-label="Silenciar"></button>
        <input type="range" id="vol" min="0" max="100" value="80" step="1" aria-label="Volume">
      </div>
    </footer>
  </div>

  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="updateCard" class="update-card" role="status" aria-live="polite" hidden></div>
  <div id="drop" class="drop" hidden><div>Solte as músicas (ou pastas) para adicionar à biblioteca</div></div>

  <dialog id="dlg">
    <form method="dialog">
      <h3 id="dlgTitle"></h3>
      <p id="dlgMsg"></p>
      <input id="dlgInput" maxlength="100" autocomplete="off" aria-label="Nome">
      <div class="dlg-actions">
        <button class="btn primary" value="ok" id="dlgOk">Salvar</button>
        <button class="btn text" value="cancel" id="dlgCancel" formnovalidate>Cancelar</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="filePick" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.webm" multiple hidden>
  <input type="file" id="folderPick" webkitdirectory multiple hidden>

  <script src="app.js"></script>
</body>
</html>
